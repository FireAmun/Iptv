name: Website

# Publishes the download page and legal pages at https://fireamun.github.io/Iptv/
# from main. Pull requests only test the site builder (in CI's repository checks).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'tests/test_build_site.py'
      - 'core/designsystem/src/main/assets/legal/**'
      - 'core/designsystem/src/main/assets/licenses/**'
      - 'core/designsystem/src/main/res/font/**'
      - 'core/designsystem/src/main/kotlin/com/fireamun/iptv/core/designsystem/AmarLegal.kt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test the site builder
        run: python -m unittest tests.test_build_site -v
      - name: Build pages
        run: python scripts/build_site.py --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
