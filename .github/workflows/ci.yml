name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Diagnostic scope only; PR and main always run the full suite
        type: choice
        required: true
        default: full
        options: [full, player, pip, tracks, forms]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android-ready: ${{ steps.android.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test repository checker
        run: python -m unittest discover -s tests -v
      - name: Validate local documentation links
        run: python scripts/check_repository.py
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem scripts -Filter '*.ps1' -Recurse
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors in $($script.Name)"
            }
          }
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Detect Android build configuration
        id: android
        shell: bash
        run: |
          if [[ -f gradlew || -f settings.gradle.kts || -f settings.gradle || -f build.gradle.kts || -f build.gradle ]]; then
            if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
              echo "::error::Partial Android setup: commit the complete Gradle wrapper before merging."
              exit 1
            fi
            if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then
              echo "::error::Gradle settings are missing."
              exit 1
            fi
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Directory-only bootstrap: Android build and runtime coverage is not available yet.' >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android build and tests
    needs: repository
    if: needs.repository.outputs.android-ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build, lint, and run local Android unit tests
        run: bash ./gradlew --no-daemon --console=plain :core:model:test :core:data:test testDebugUnitTest lintDebug assembleDebug :app:assembleDebugAndroidTest
      - name: Save installable prototype
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iptv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  device-smoke:
    name: Device smoke (${{ matrix.device }})
    needs: [repository, android]
    if: needs.repository.outputs.android-ready == 'true'
    runs-on: ubuntu-24.04
    # The expanded modern phone completed106 cases before its25min job deadline.
    # Preserve all tests/probes and allow bounded setup + complete109-case results.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-api28
            api: 28
            target: default
            profile: pixel_2
          - device: phone-api36
            api: 36
            target: google_apis
            profile: pixel_2
          - device: tv-api36
            api: 36
            target: android-tv
            profile: tv_1080p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve disk space for recent system images
        if: matrix.api >= 36
        run: |
          # These preinstalled SDKs are unused by this app on the disposable Linux runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h .
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Run import, playback, language, and remote tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          IPTV_TEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_scope || 'full' }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          # Keep headless software rendering on GLES; cloud emulator context failures
          # have interrupted mandatory post-suite persistence checks.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: bash ./scripts/device-tests.sh
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-reports-${{ matrix.device }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device-previews/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI
    if: always()
    needs: [repository, android, device-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          ANDROID_READY: ${{ needs.repository.outputs.android-ready }}
          ANDROID_RESULT: ${{ needs.android.result }}
          DEVICE_RESULT: ${{ needs.device-smoke.result }}
        run: |
          if [[ "$REPOSITORY_RESULT" != success ]]; then
            echo 'Repository checks did not pass.'
            exit 1
          fi
          if [[ "$ANDROID_READY" == true && "$ANDROID_RESULT" != success ]]; then
            echo 'Android checks did not pass.'
            exit 1
          fi
          if [[ "$ANDROID_READY" != true && "$ANDROID_RESULT" != skipped ]]; then
            echo 'Unexpected Android check state.'
            exit 1
          fi
          if [[ "$ANDROID_READY" == true && "$DEVICE_RESULT" != success ]]; then
            echo 'Device smoke tests did not pass.'
            exit 1
          fi
          echo 'All checks available for this repository stage passed.'
